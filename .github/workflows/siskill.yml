name: SiSkill
on:
  push:
    branches: [main, 'codex/siskill-*']
  pull_request:
    paths:
      - 'apps/siskill/**'
      - 'scripts/siskill-*.mjs'
      - 'src/web/pages/skill-catalog/**'
      - 'src/web/styles/**'
      - 'src/shared/skill-showcases.json'
      - '.github/workflows/siskill.yml'
      - 'src/__tests__/siskill-commerce-*.test.ts'
      - 'supabase/migrations/*siskill*.sql'
      - 'api/utils/zpay.ts'
permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p apps/siskill/tsconfig.json
      - run: pnpm exec vitest run --config apps/siskill/vitest.config.ts
      - run: pnpm exec vite build --config apps/siskill/vite.config.ts
      - run: node apps/siskill/verify-public.mjs
      - run: pnpm exec wrangler deploy --dry-run --config apps/siskill/wrangler.jsonc
